<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}TruthLens{% endblock %} · Fake News Detection</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    try { var t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <style>
    :root{
      --bg:#f4f6fb; --surface:#fff; --surface-2:#f8f9fc; --ink:#111827; --ink-2:#4b5563; --muted:#8a93a3;
      --line:#e5e8ef; --brand:#4f46e5; --brand-soft:#eef0ff;
      --fake:#dc2626; --fake-soft:#fef2f2; --fake-line:#fecaca;
      --real:#059669; --real-soft:#ecfdf5; --real-line:#a7f3d0;
      --unc:#d97706; --unc-soft:#fffbeb; --unc-line:#fde68a;
      --shadow:0 1px 2px rgba(16,24,40,.04), 0 8px 24px rgba(16,24,40,.06);
      --radius:16px; --nav-h:64px;
    }
    @media (prefers-color-scheme: dark){
      :root:not([data-theme="light"]){
        --bg:#0b0f19; --surface:#121826; --surface-2:#0f1522; --ink:#e8ebf2; --ink-2:#aab2c0; --muted:#727c8e;
        --line:#232b3b; --brand:#818cf8; --brand-soft:#1c2140;
        --fake:#f87171; --fake-soft:#2a1416; --fake-line:#5b2328;
        --real:#34d399; --real-soft:#0f2620; --real-line:#1f5544;
        --unc:#fbbf24; --unc-soft:#2a2210; --unc-line:#5c4818;
        --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
      }
    }
    :root[data-theme="dark"]{
      --bg:#0b0f19; --surface:#121826; --surface-2:#0f1522; --ink:#e8ebf2; --ink-2:#aab2c0; --muted:#727c8e;
      --line:#232b3b; --brand:#818cf8; --brand-soft:#1c2140;
      --fake:#f87171; --fake-soft:#2a1416; --fake-line:#5b2328;
      --real:#34d399; --real-soft:#0f2620; --real-line:#1f5544;
      --unc:#fbbf24; --unc-soft:#2a2210; --unc-line:#5c4818;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    }
    *{box-sizing:border-box}
    html,body{margin:0}
    body{background:var(--bg); color:var(--ink); font-family:Inter,"Segoe UI",system-ui,-apple-system,Arial,sans-serif;
         -webkit-font-smoothing:antialiased; line-height:1.5; min-height:100vh; display:flex; flex-direction:column}
    a{color:var(--brand); text-decoration:none}
    .container{max-width:1180px; margin:0 auto; padding:0 20px; width:100%}

    /* ---------- top navigation ---------- */
    header{position:sticky; top:0; z-index:20; background:color-mix(in srgb,var(--bg) 88%,transparent);
           backdrop-filter:blur(10px); border-bottom:1px solid var(--line)}
    .nav{display:flex; align-items:center; gap:24px; height:var(--nav-h)}
    .logo{display:flex; align-items:center; gap:10px; font-weight:800; font-size:18px; letter-spacing:-.02em; color:var(--ink)}
    .logo-mark{width:34px; height:34px; border-radius:10px; display:grid; place-items:center; color:#fff;
               background:linear-gradient(135deg,#4f46e5,#8b5cf6)}
    .tabs{display:flex; gap:4px; flex:1}
    .tab{display:flex; align-items:center; gap:8px; padding:8px 14px; border-radius:10px; color:var(--ink-2);
         font-weight:600; font-size:14px; transition:.15s}
    .tab:hover{background:var(--surface); color:var(--ink)}
    .tab.active{background:var(--brand-soft); color:var(--brand)}
    .tab svg{flex:none}
    .icon-btn{width:38px; height:38px; border-radius:10px; border:1px solid var(--line); background:var(--surface);
              color:var(--ink-2); display:grid; place-items:center; cursor:pointer}
    .icon-btn:hover{color:var(--ink)}

    /* bottom tab bar on phones */
    @media (max-width:820px){
      header{backdrop-filter:none; background:var(--bg)}
      .tabs{position:fixed; left:0; right:0; bottom:0; z-index:30; justify-content:space-around; gap:0;
            background:var(--surface); border-top:1px solid var(--line); padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
      .tab{flex-direction:column; gap:2px; font-size:11px; padding:6px 2px; flex:1; justify-content:center; white-space:nowrap}
      .nav{justify-content:space-between}
      main{padding-bottom:84px}
    }

    main{flex:1; padding:28px 0 36px}
    .page-head{margin-bottom:22px}
    .page-head h1{font-size:clamp(24px,3.2vw,32px); line-height:1.2; margin:0 0 6px; letter-spacing:-.03em; font-weight:800}
    .page-head p{margin:0; color:var(--ink-2); max-width:680px}
    .grad{background:linear-gradient(90deg,var(--brand),#a855f7); -webkit-background-clip:text; background-clip:text; color:transparent}

    .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow)}
    .pad{padding:22px}
    .card-title{display:flex; align-items:center; justify-content:space-between; gap:10px; margin:0 0 14px}
    .card-title h2{font-size:16px; margin:0; font-weight:700}
    .hint{font-size:12px; color:var(--muted)}
    .btn{border:0; border-radius:12px; padding:13px 20px; font:600 15px Inter,sans-serif; cursor:pointer; transition:.15s;
         display:inline-flex; align-items:center; justify-content:center; gap:8px}
    .btn-primary{color:#fff; background:linear-gradient(135deg,#4f46e5,#7c3aed); box-shadow:0 6px 16px rgba(79,70,229,.25)}
    .btn-primary:hover{transform:translateY(-1px)}
    .btn-primary:disabled{opacity:.7; cursor:wait; transform:none}
    .btn-ghost{background:var(--surface-2); color:var(--ink-2); border:1px solid var(--line)}
    .btn-ghost:hover{color:var(--ink)}
    .chip{border:1px solid var(--line); background:var(--surface-2); color:var(--ink-2); font:500 13px Inter,sans-serif;
          padding:7px 12px; border-radius:999px; cursor:pointer; transition:.15s; display:inline-flex; align-items:center; gap:6px}
    .chip:hover, .chip.on{border-color:var(--brand); color:var(--brand)}
    .chip.on{background:var(--brand-soft)}
    .dot{width:7px; height:7px; border-radius:50%; display:inline-block}
    .badge{font-size:11px; font-weight:700; padding:3px 8px; border-radius:999px; border:1px solid; white-space:nowrap}
    .badge.FAKE{color:var(--fake); background:var(--fake-soft); border-color:var(--fake-line)}
    .badge.REAL{color:var(--real); background:var(--real-soft); border-color:var(--real-line)}
    .badge.UNCERTAIN{color:var(--unc); background:var(--unc-soft); border-color:var(--unc-line)}
    .alert{padding:12px 14px; border-radius:12px; font-size:14px; display:flex; gap:10px; align-items:flex-start}
    .alert-warn{background:var(--unc-soft); color:var(--unc); border:1px solid var(--unc-line)}
    .alert-err{background:var(--fake-soft); color:var(--fake); border:1px solid var(--fake-line)}
    .hidden{display:none !important}
    footer{border-top:1px solid var(--line); padding:16px 0; color:var(--muted); font-size:13px}
    footer .container{display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px}
    @media (max-width:820px){ footer{display:none} }
    {% block styles %}{% endblock %}
  </style>
</head>
<body>
<header>
  <div class="container nav">
    <a class="logo" href="/">
      <span class="logo-mark">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/><path d="m8.5 11 1.8 1.8 3.4-3.6"/></svg>
      </span>
      TruthLens
    </a>
    <nav class="tabs">
      <a class="tab {% if active=='analyze' %}active{% endif %}" href="/">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Analyze</a>
      <a class="tab {% if active=='history' %}active{% endif %}" href="/history">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg>History</a>
      <a class="tab {% if active=='performance' %}active{% endif %}" href="/performance">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/></svg>Performance</a>
      <a class="tab {% if active=='how' %}active{% endif %}" href="/how-it-works">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><path d="M10 6.5h4M17.5 10v4"/></svg>How it works</a>
      <a class="tab {% if active=='about' %}active{% endif %}" href="/about">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>About</a>
    </nav>
    <button class="icon-btn" id="themeBtn" title="Toggle dark mode" aria-label="Toggle dark mode">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </div>
</header>

<main>
  <div class="container">
    {% block content %}{% endblock %}
  </div>
</main>

<footer>
  <div class="container">
    <span>TruthLens — Fake News Detection using Deep Learning &amp; NLP</span>
    <span>Python · PyTorch · Hugging Face Transformers · Flask</span>
  </div>
</footer>

<script>
  // shared helpers
  window.TL = {
    KEY: 'truthlens_history',
    load(){ try { return JSON.parse(localStorage.getItem(this.KEY)) || []; } catch(e){ return []; } },
    save(h){ try { localStorage.setItem(this.KEY, JSON.stringify(h.slice(0, 50))); } catch(e){} },
    add(item){ const h = this.load().filter(x => x.text !== item.text); h.unshift(item); this.save(h); }
  };
  document.getElementById('themeBtn').addEventListener('click', () => {
    const r = document.documentElement;
    const dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    r.dataset.theme = dark ? 'light' : 'dark';
    try { localStorage.setItem('theme', r.dataset.theme); } catch(e){}
  });
</script>
{% block scripts %}{% endblock %}
</body>
</html>
